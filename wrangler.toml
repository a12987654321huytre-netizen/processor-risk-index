# Cloudflare Workers Builds (`npx wrangler deploy`).
# Assets-only SPA — no Worker script. Do not use pages_build_output_dir here;
# that flag is for classic Pages and makes `wrangler deploy` fail.
# Do not ship a Pages `/* /index.html 200` _redirects file — Workers HTML
# pretty-URLs treat that as an infinite loop (API 100324).
name = "processor-risk-index"
compatibility_date = "2026-09-06"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
